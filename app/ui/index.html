<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlattenPDF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon.png" alt="" width="28" height="28">
      <h1>FlattenPDF</h1>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button type="button" role="tab" data-tab="flatten"><span aria-hidden="true">🔒</span> <span data-i18n="tabFlatten"></span></button>
      <button type="button" role="tab" data-tab="images"><span aria-hidden="true">🖼️</span> <span data-i18n="tabImages"></span></button>
      <button type="button" role="tab" data-tab="watermark"><span aria-hidden="true">💧</span> <span data-i18n="tabWatermark"></span></button>
    </nav>
    <div class="header-toggles">
      <button id="theme-toggle" class="toggle" type="button" role="switch">
        <span class="thumb" aria-hidden="true"></span>
        <span class="opt emoji" data-opt="light" aria-hidden="true">🌞</span>
        <span class="opt emoji" data-opt="dark" aria-hidden="true">🌛</span>
      </button>
      <button id="lang-toggle" class="toggle" type="button" role="switch">
        <span class="thumb" aria-hidden="true"></span>
        <span class="opt" data-opt="th" aria-hidden="true">TH</span>
        <span class="opt" data-opt="en" aria-hidden="true">EN</span>
      </button>
    </div>
  </header>

  <main>
    <section id="drop" class="drop">
      <p class="drop-title" data-i18n="dropTitle"></p>
      <p class="drop-hint" id="drop-hint"></p>
      <p class="drop-more" data-i18n="dropMore"></p>
      <button id="add" type="button" class="secondary" data-i18n="addFiles"></button>
    </section>

    <ul id="files" class="files" hidden></ul>

    <section class="settings" data-panel="flatten">
      <div class="field">
        <span class="label" data-i18n="resolution"></span>
        <div class="segmented" data-setting="flatten.dpi">
          <button type="button" data-value="150"><b>150</b> <span data-i18n="dpiSmall"></span></button>
          <button type="button" data-value="200"><b>200</b> <span data-i18n="dpiBalanced"></span></button>
          <button type="button" data-value="300"><b>300</b> <span data-i18n="dpiSharp"></span></button>
        </div>
      </div>
      <div class="field">
        <label class="label" for="quality"><span data-i18n="quality"></span> <output id="quality-out"></output></label>
        <input id="quality" type="range" min="50" max="100" step="1">
      </div>
      <div class="field inline">
        <label class="switch"><input id="gray" type="checkbox"><span data-i18n="grayscale"></span></label>
      </div>
      <div class="field">
        <label class="label" for="flatten-suffix" data-i18n="suffix"></label>
        <input id="flatten-suffix" type="text" spellcheck="false" data-suffix="flatten">
      </div>
    </section>

    <section class="settings" data-panel="images">
      <div class="field">
        <span class="label" data-i18n="resolution"></span>
        <div class="segmented" data-setting="images.dpi">
          <button type="button" data-value="150"><b>150</b> <span data-i18n="dpiSmall"></span></button>
          <button type="button" data-value="200"><b>200</b> <span data-i18n="dpiBalanced"></span></button>
          <button type="button" data-value="300"><b>300</b> <span data-i18n="dpiSharp"></span></button>
        </div>
      </div>
      <div class="field">
        <span class="label" data-i18n="rotate"></span>
        <div class="segmented" data-setting="images.rotation">
          <button type="button" data-value="none" data-i18n="rotNone"></button>
          <button type="button" data-value="left">⟲ <span data-i18n="rotLeft"></span></button>
          <button type="button" data-value="right">⟳ <span data-i18n="rotRight"></span></button>
          <button type="button" data-value="half">↻ 180°</button>
        </div>
      </div>
      <div class="field">
        <span class="label" data-i18n="packaging"></span>
        <div class="segmented" data-setting="images.packaging">
          <button type="button" data-value="folder">📁 <span data-i18n="packFolder"></span></button>
          <button type="button" data-value="zip">🗜️ .zip</button>
        </div>
      </div>
      <div class="field">
        <label class="label" for="pages" data-i18n="pageRange"></label>
        <input id="pages" type="text" spellcheck="false" data-i18n-placeholder="pageRangeHint">
      </div>
    </section>

    <section class="settings wm" data-panel="watermark">
      <div class="field full">
        <span class="label" data-i18n="profile"></span>
        <div class="row wrap">
          <select id="wm-profile"></select>
          <input id="wm-profile-name" type="text" spellcheck="false" data-i18n-placeholder="profileName">
          <button id="wm-profile-save" type="button" class="secondary small" data-i18n="saveProfile"></button>
          <button id="wm-profile-delete" type="button" class="ghost small" data-i18n="deleteProfile"></button>
        </div>
      </div>

      <div class="wm-controls">
        <div class="field">
          <span class="label" data-i18n="wmType"></span>
          <div class="segmented" data-wm="type">
            <button type="button" data-value="text">🔤 <span data-i18n="wmText"></span></button>
            <button type="button" data-value="image">🖼️ <span data-i18n="wmImage"></span></button>
          </div>
        </div>

        <div class="wm-text-only">
          <div class="field">
            <label class="label" for="wm-text" data-i18n="wmTextLabel"></label>
            <textarea id="wm-text" rows="2" spellcheck="false"></textarea>
          </div>
          <div class="field">
            <label class="label" for="wm-font" data-i18n="font"></label>
            <div class="row">
              <input id="wm-font" type="text" list="wm-fonts" spellcheck="false">
              <datalist id="wm-fonts"></datalist>
              <input id="wm-color" type="color" data-i18n-title="color">
              <button id="wm-bold" type="button" class="style-btn" data-i18n-title="bold"><b>B</b></button>
              <button id="wm-italic" type="button" class="style-btn" data-i18n-title="italic"><i>I</i></button>
            </div>
          </div>
        </div>

        <div class="wm-image-only field">
          <span class="label" data-i18n="wmImageLabel"></span>
          <div class="row">
            <img id="wm-image-thumb" class="thumb" alt="" hidden>
            <span id="wm-image-name" class="path"></span>
            <button id="wm-image-pick" type="button" class="ghost small" data-i18n="chooseImage"></button>
          </div>
        </div>

        <div class="field">
          <label class="label" for="wm-size"><span data-i18n="size"></span> <output id="wm-size-out"></output></label>
          <input id="wm-size" type="range" min="5" max="100" step="1">
        </div>
        <div class="field">
          <label class="label" for="wm-rotation"><span data-i18n="angle"></span> <output id="wm-rotation-out"></output></label>
          <input id="wm-rotation" type="range" min="-90" max="90" step="1">
          <div class="quick" id="wm-rotation-quick">
            <button type="button" class="ghost small" data-value="-45">-45°</button>
            <button type="button" class="ghost small" data-value="0">0°</button>
            <button type="button" class="ghost small" data-value="45">45°</button>
            <button type="button" class="ghost small" data-value="90">90°</button>
          </div>
        </div>
        <div class="field">
          <label class="label" for="wm-opacity"><span data-i18n="opacity"></span> <output id="wm-opacity-out"></output></label>
          <input id="wm-opacity" type="range" min="5" max="100" step="1">
        </div>

        <div class="field">
          <span class="label" data-i18n="position"></span>
          <div class="position-grid" id="wm-position">
            <button type="button" data-value="topLeft" aria-label="↖">↖</button>
            <button type="button" data-value="top" aria-label="↑">↑</button>
            <button type="button" data-value="topRight" aria-label="↗">↗</button>
            <button type="button" data-value="left" aria-label="←">←</button>
            <button type="button" data-value="center" aria-label="•">•</button>
            <button type="button" data-value="right" aria-label="→">→</button>
            <button type="button" data-value="bottomLeft" aria-label="↙">↙</button>
            <button type="button" data-value="bottom" aria-label="↓">↓</button>
            <button type="button" data-value="bottomRight" aria-label="↘">↘</button>
            <button type="button" data-value="tile" class="tile" data-i18n="tile"></button>
          </div>
        </div>

        <div class="field">
          <span class="label" data-i18n="pagesToStamp"></span>
          <div class="segmented" data-wm="pageMode">
            <button type="button" data-value="all" data-i18n="pagesAll"></button>
            <button type="button" data-value="only" data-i18n="pagesOnly"></button>
            <button type="button" data-value="except" data-i18n="pagesExcept"></button>
          </div>
          <input id="wm-pages" type="text" spellcheck="false" data-i18n-placeholder="pagesHint" hidden>
        </div>

        <div class="field">
          <label class="switch"><input id="wm-flatten" type="checkbox"><span data-i18n="flattenAfter"></span></label>
          <span class="note" data-i18n="flattenAfterNote"></span>
        </div>
        <div class="field">
          <label class="label" for="wm-suffix" data-i18n="suffix"></label>
          <input id="wm-suffix" type="text" spellcheck="false">
        </div>
      </div>

      <div class="wm-preview">
        <div class="preview-frame">
          <img id="wm-preview-img" alt="" hidden>
          <span id="wm-preview-msg" class="muted" data-i18n="previewEmpty"></span>
        </div>
        <div class="row center">
          <button id="wm-prev-page" type="button" class="ghost small" aria-label="◀">◀</button>
          <span id="wm-page-label" class="muted"></span>
          <button id="wm-next-page" type="button" class="ghost small" aria-label="▶">▶</button>
        </div>
      </div>
    </section>

    <section class="settings">
      <div class="field full">
        <span class="label" data-i18n="saveTo"></span>
        <div class="row">
          <span id="outdir" class="path"></span>
          <button id="choose-dir" type="button" class="ghost small" data-i18n="change"></button>
          <button id="reset-dir" type="button" class="ghost small" data-i18n="sameFolder" hidden></button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span id="summary" class="muted"></span>
    <div class="actions">
      <button id="clear" type="button" class="ghost" data-i18n="clear"></button>
      <button id="start" type="button" class="primary"></button>
      <button id="cancel" type="button" class="danger" data-i18n="cancel" hidden></button>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="main.js"></script>
  <script src="watermark.js"></script>
</body>
</html>
