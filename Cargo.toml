[workspace]
resolver = "2"
members = ["crates/flatten-core", "crates/flatten-cli", "app/src-tauri"]
# The desktop app needs system WebView libraries; build it explicitly with `-p flattenpdf-app`.
default-members = ["crates/flatten-core", "crates/flatten-cli"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/abhuri/flattenPDF"

[workspace.dependencies]
flatten-core = { path = "crates/flatten-core" }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
crossbeam-channel = "0.5.17"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
